<!DOCTYPE html>
<html lang="en">
{% include header.html %}
<body role="document">
<a class="skip-link" href="#main-content">Skip to main content</a>
{% include navbar.html nav=site.data.navbar %}
  <main id="main-content" class="container theme-showcase" role="main">
    <div class="docs-surface doc-content">
      {% include breadcrumbs.html %}
      {{ content }}
    </div>
  </main>
  <button type="button" id="scroll-top" class="scroll-top" aria-label="Scroll to top" title="Scroll to top">
    <span aria-hidden="true">Top</span>
  </button>
  <noscript>
    <style>
      .theme-toggle, .scroll-top { display: none !important; }
    </style>
  </noscript>
  {% include footer.html %}
</body>
</html>
