<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <meta name="keywords" content="JHOVE, JOVE, JSTOR, Harvard, object, validation,

    2000, PDF, TIFF, UTF-8, WAVE, XML, XMP, Adobe, ISO, ANSI, IETF, RFC">

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32">
    <link rel="icon" type="image/png" href="/favicon-16x16.png" sizes="16x16">
    <link rel="manifest" href="/manifest.json">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5">
    <meta name="apple-mobile-web-app-title" content="JHOVE">
    <meta name="application-name" content="JHOVE">
    <meta name="theme-color" content="#ffffff">

    <!-- Fontawesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Bootstrap -->
    <!-- Latest compiled and minified CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.1/css/bootstrap.min.css">
    <!-- Optional theme -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.1/css/bootstrap-theme.min.css">

    <!-- HTML5 shim and Respond.js for IE8 support of HTML5 elements and media queries -->
    <!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
    <!--[if lt IE 9]>
      <script src="https://oss.maxcdn.com/html5shiv/3.7.2/html5shiv.min.js"></script>
      <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Add .table class to all tables
            document.querySelectorAll("table").forEach(function (table) {
                table.classList.add("table", "table-striped");
            });
            document.querySelectorAll(".section-heading").forEach(function (heading) {
                heading.addEventListener("click", function () {
                    const id = heading.getAttribute("id");
                    const url = `${window.location.origin}${window.location.pathname}#${id}`;
                    
                    // Copy the link to the clipboard
                    navigator.clipboard.writeText(url).then(() => {
                        // Create a temporary "Copied!" notification
                        const notification = document.createElement("span");
                        notification.textContent = "Hyperlink Copied!";
                        notification.className = "copied-notification badge";
                        notification.style.position = "absolute";
                        notification.style.marginLeft = "30px";
                        
                        // Append the notification next to the heading
                        heading.appendChild(notification);
    
                        // Fade out and remove the notification after 2 seconds
                        setTimeout(() => {
                            notification.style.opacity = "0";
                            setTimeout(() => notification.remove(), 500);
                        }, 2000);
                    });
                });
            });
        });
    </script>
</head>
